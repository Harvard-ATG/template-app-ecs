version: 0.2

# Custom buildspec for template-app-ecs
# Builds both API and frontend Docker images
# Uses AWS ECR Public to avoid Docker Hub rate limits

env:
  parameter-store:
    BUILD_SSH_KEY: ${BUILD_SSH_KEY_SSM_PATH}

phases:
  pre_build:
    commands:
      # Setup SSH for GitHub access
      - echo "Setting up SSH key for GitHub..."
      - mkdir -p ~/.ssh
      - echo "$BUILD_SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - ssh-keygen -F github.com || ssh-keyscan github.com >> ~/.ssh/known_hosts
      
      # Convert HTTPS URL to SSH URL for cloning
      - echo "Preparing repository clone..."
      - GIT_VERSION=${GIT_VERSION:-main}
      - VERSION_IN_USE_TAG=$(echo $GIT_VERSION | sed 's/[^[:alnum:]._-]/_/g')
      - |
        if [[ $GIT_REPO == https://github.com/* ]]; then
          SSH_REPO=$(echo $GIT_REPO | sed 's|https://github.com/|git@github.com:|')
          echo "Converted HTTPS to SSH: $SSH_REPO"
        else
          SSH_REPO=$GIT_REPO
          echo "Using provided SSH URL: $SSH_REPO"
        fi
      
      # Clone repository using SSH
      - echo "Cloning repository..."
      - git clone --depth 1 --branch $GIT_VERSION $SSH_REPO $CODEBUILD_SRC_DIR/repo
      - cd $CODEBUILD_SRC_DIR/repo/
      
      # Generate tags
      - COMMIT_HASH=$(git rev-parse HEAD | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - DATE_TAG=$(date '+%Y-%m-%dT%H-%M-%S')
      - echo "Images will be tagged with - latest, $IMAGE_TAG, $DATE_TAG, $VERSION_IN_USE_TAG"
      
      # Login to ECR
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REGISTRY

  build:
    commands:
      - echo "Building Docker images..."
      - cd $CODEBUILD_SRC_DIR/repo/
      
      # Build API image
      - echo "Building API image..."
      - >
        docker build --file packages/api/Dockerfile
        --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        --label "org.opencontainers.image.revision=$COMMIT_HASH"
        --label "org.opencontainers.image.version=$VERSION_IN_USE_TAG"
        --label "org.opencontainers.image.source=$GIT_REPO"
        --tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$IMAGE_TAG .
      
      # Tag API image with multiple tags
      - docker tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$IMAGE_TAG ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:latest
      - docker tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$IMAGE_TAG ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$DATE_TAG
      - docker tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$IMAGE_TAG ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$VERSION_IN_USE_TAG
      
      # Build Frontend image
      - echo "Building Frontend image..."
      - >
        docker build --file frontend/Dockerfile
        --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
        --label "org.opencontainers.image.revision=$COMMIT_HASH"
        --label "org.opencontainers.image.version=$VERSION_IN_USE_TAG"
        --label "org.opencontainers.image.source=$GIT_REPO"
        --tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$IMAGE_TAG .
      
      # Tag Frontend image with multiple tags
      - docker tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$IMAGE_TAG ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:latest
      - docker tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$IMAGE_TAG ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$DATE_TAG
      - docker tag ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$IMAGE_TAG ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$VERSION_IN_USE_TAG

  post_build:
    commands:
      - echo "Pushing images to ECR..."
      
      # Push API images
      - echo "Pushing API images..."
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:latest
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$IMAGE_TAG
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$DATE_TAG
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-api:$VERSION_IN_USE_TAG
      
      # Push Frontend images
      - echo "Pushing Frontend images..."
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:latest
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$IMAGE_TAG
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$DATE_TAG
      - docker push ${ECR_REGISTRY}/atg/${ECR_REPOSITORY_NAME}-web:$VERSION_IN_USE_TAG
      
      - echo "Build completed successfully!"
      - echo "API images available with tags - latest, $IMAGE_TAG, $DATE_TAG, $VERSION_IN_USE_TAG"
      - echo "Frontend images available with tags - latest, $IMAGE_TAG, $DATE_TAG, $VERSION_IN_USE_TAG"

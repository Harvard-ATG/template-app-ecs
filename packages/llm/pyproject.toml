[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "app_llm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic~=0.40",
    "pydantic~=2.13",
    "app_schemas",
]

[tool.uv.sources]
app_schemas = { path = "../schemas" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
